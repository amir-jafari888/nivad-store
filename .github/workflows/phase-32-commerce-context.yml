name: Phase 32 Commerce Context
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
jobs:
  commerce-context-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax checks
        run: |
          node --check --input-type=module < assets/js/modules/commerce-context.js
          node --check --input-type=module < assets/js/modules/search.js
          node --check --input-type=module < assets/js/modules/product-detail.js
          node --check --input-type=module < assets/js/modules/setup-builder.js
      - name: PHP syntax check
        run: php -l test-phase-31-content-support.php
      - name: Run canonical read-only contract suite
        run: php test-phase-31-content-support.php
