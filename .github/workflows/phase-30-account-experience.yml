name: Phase 30 Account Experience
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
jobs:
  account-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: PHP syntax checks
        run: |
          php -l pages/account/index.php
          php -l pages/account/profile.php
          php -l pages/account/addresses.php
          php -l pages/account/orders/index.php
          php -l pages/account/orders/show.php
          php -l pages/account/returns/index.php
          php -l pages/account/returns/show.php
          php -l pages/account/reviews.php
          php -l pages/account/notifications.php
      - name: JavaScript syntax checks
        run: |
          node --input-type=module --check < assets/js/modules/account.js
          node --input-type=module --check < assets/js/modules/customer-commerce.js
          node --input-type=module --check < assets/js/modules/customer-shop.js
