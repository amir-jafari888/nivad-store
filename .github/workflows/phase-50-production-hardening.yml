name: Phase 50 — Production Hardening Audit

on:
  push:
    branches:
      - phase-50-production-hardening
  pull_request:
    branches:
      - phase-49-pre-production-seo-security
      - master

jobs:
  production-hardening:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: none
          coverage: none

      - name: Lint Phase 50 audit
        run: php -l test-phase-50-production-hardening.php

      - name: Lint audited PHP source files
        run: |
          php -l config/app.php
          php -l config/security.php
          php -l app/Core/Bootstrap.php
          php -l app/Middleware/SecurityHeadersMiddleware.php
          php -l partials/header.php
          php -l partials/footer.php
          php -l pages/shop/cart.php
          php -l pages/shop/wishlist.php
          php -l pages/shop/checkout.php
          php -l pages/store/products/index.php
          php -l pages/store/products/show.php
          php -l pages/auth/login.php
          php -l pages/auth/register.php
          php -l index.php

      - name: Run read-only Phase 50 contract audit
        run: php test-phase-50-production-hardening.php
